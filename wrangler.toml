name = "sauogfjell"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
# D1 binding. `binding = "DB"` is the name the code reads as env.DB.
# database_id is filled in after `wrangler d1 create sauogfjell` (placeholder works for local dev).
[[d1_databases]]
binding = "DB"
database_name = "sauogfjell"
database_id = "b555915f-ca50-4a72-9453-a8fb597ed877"
migrations_dir = "migrations"
[assets]
directory = "./dist"